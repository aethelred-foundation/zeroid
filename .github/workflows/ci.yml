name: ZeroID CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  RUST_VERSION: "1.85"
  GO_VERSION: "1.25.12"
  CIRCOM_VERSION: "2.2.3"
  # Immutable Aethelred main SHA. ZeroID consumes the SDK as a sibling
  # workspace package until @aethelred/sdk has a signed registry release.
  AETHELRED_REF: 20d6060adc91860736f4ba619fe29cbda54b2cf7

jobs:
  # ===========================================================================
  # SECURITY
  # ===========================================================================
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Checkout canonical Aethelred SDK source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: aethelred-foundation/aethelred
          ref: ${{ env.AETHELRED_REF }}
          path: .aethelred-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Build canonical Aethelred SDK
        working-directory: ./.aethelred-source/sdk/typescript
        run: |
          npm ci
          npm run build
      - name: Expose canonical SDK as the lockfile-pinned sibling package
        run: ln -sfn "$GITHUB_WORKSPACE/.aethelred-source" "$GITHUB_WORKSPACE/../aethelred"
      - run: npm ci
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Validate ZK circuit schema manifest
        run: npm run circuits:validate
      - name: Validate enterprise route schemas
        run: npm run routes:validate
      - name: Validate workflow action pinning
        run: npm run workflows:validate
      - name: Validate ZeroID readiness evidence
        run: npm run readiness:check
      - name: NPM Security Audit
        run: npm run security:audit:all
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4
        with:
          tool: cargo-audit
      - name: Rust Security Audit
        working-directory: ./crates/zeroid-tee
        run: cargo audit --deny warnings
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sdk/go/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Go Vulnerability Audit
        working-directory: ./sdk/go
        run: $(go env GOPATH)/bin/govulncheck ./...

  # ===========================================================================
  # LINT & TYPE-CHECK
  # ===========================================================================
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Checkout canonical Aethelred SDK source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: aethelred-foundation/aethelred
          ref: ${{ env.AETHELRED_REF }}
          path: .aethelred-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Build canonical Aethelred SDK
        working-directory: ./.aethelred-source/sdk/typescript
        run: |
          npm ci
          npm run build
      - name: Expose canonical SDK as the lockfile-pinned sibling package
        run: ln -sfn "$GITHUB_WORKSPACE/.aethelred-source" "$GITHUB_WORKSPACE/../aethelred"
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run format:check

  # ===========================================================================
  # ZK CIRCUIT COMPILATION
  # ===========================================================================
  # Three circuits reached main uncompilable and documented as working features
  # because nothing compiled them. This job compiles all of them and fails on
  # any change to the recorded known-broken set, in either direction.
  #
  # GitHub Actions for this organisation has been billing-locked since
  # 2026-08-17, so this job has never executed and proves nothing yet. Until
  # that is lifted the gate is enforced by running `npm run circuits:compile:check`
  # locally; the script exits 2 (not 1) when circom is absent, so a run that
  # skipped the toolchain can never be mistaken for a clean gate.
  circuits-compile:
    name: ZK Circuit Compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Checkout canonical Aethelred SDK source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: aethelred-foundation/aethelred
          ref: ${{ env.AETHELRED_REF }}
          path: .aethelred-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Build canonical Aethelred SDK
        working-directory: ./.aethelred-source/sdk/typescript
        run: |
          npm ci
          npm run build
      - name: Expose canonical SDK as the lockfile-pinned sibling package
        run: ln -sfn "$GITHUB_WORKSPACE/.aethelred-source" "$GITHUB_WORKSPACE/../aethelred"
      # circomlib is a declared dependency; the check resolves it from node_modules.
      - run: npm ci
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install circom
        run: |
          cargo install --locked --git https://github.com/iden3/circom \
            --tag v${{ env.CIRCOM_VERSION }} circom
          circom --version
      - name: Test the circuit compilation gate
        run: npm run circuits:compile:test
      - name: Compile every ZK circuit
        run: npm run circuits:compile:check

  # ===========================================================================
  # FRONTEND TESTS
  # ===========================================================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Checkout canonical Aethelred SDK source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: aethelred-foundation/aethelred
          ref: ${{ env.AETHELRED_REF }}
          path: .aethelred-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Build canonical Aethelred SDK
        working-directory: ./.aethelred-source/sdk/typescript
        run: |
          npm ci
          npm run build
      - name: Expose canonical SDK as the lockfile-pinned sibling package
        run: ln -sfn "$GITHUB_WORKSPACE/.aethelred-source" "$GITHUB_WORKSPACE/../aethelred"
      - run: npm ci
      - run: npm run test:ci
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          files: ./coverage/lcov.info
          flags: frontend
        continue-on-error: true

  # ===========================================================================
  # BACKEND TESTS
  # ===========================================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run backend tests
        working-directory: ./backend
        run: npm test

  # ===========================================================================
  # SMART CONTRACT TESTS
  # ===========================================================================
  test-contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d
      - name: Compile contracts
        run: forge build
      - name: Run Forge tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            forge test -vv \
              --no-match-contract 'AccumulatorRevocation(Fuzz|Invariant)Test'
          else
            forge test -vv
          fi

  # ===========================================================================
  # RUST TEE CRATE
  # ===========================================================================
  test-rust:
    name: Rust TEE Crate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Install cargo-audit
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4
        with:
          tool: cargo-audit
      - name: Check formatting
        working-directory: ./crates/zeroid-tee
        run: cargo fmt -- --check
      - name: Run Clippy
        working-directory: ./crates/zeroid-tee
        run: cargo clippy --all-targets -- -D clippy::correctness -W clippy::suspicious -A unused-imports -A unused-variables -A clippy::new-without-default
      - name: Run tests
        working-directory: ./crates/zeroid-tee
        run: cargo test
      - name: Run cargo audit
        working-directory: ./crates/zeroid-tee
        run: cargo audit --deny warnings

  # ===========================================================================
  # GO SDK TESTS
  # ===========================================================================
  test-go:
    name: Go SDK Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sdk/go/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run Go tests
        working-directory: ./sdk/go
        run: go test ./...
      - name: Run govulncheck
        working-directory: ./sdk/go
        run: $(go env GOPATH)/bin/govulncheck ./...

  # ===========================================================================
  # PRODUCTION IMAGE
  # ===========================================================================
  test-docker:
    name: Production Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build frontend production image
        run: docker build --pull --progress=plain -t zeroid-frontend:${{ github.sha }} .

  # ===========================================================================
  # BUILD
  # ===========================================================================
  production-readiness:
    name: Production Release Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Checkout canonical Aethelred SDK source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: aethelred-foundation/aethelred
          ref: ${{ env.AETHELRED_REF }}
          path: .aethelred-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Build canonical Aethelred SDK
        working-directory: ./.aethelred-source/sdk/typescript
        run: |
          npm ci
          npm run build
      - name: Expose canonical SDK as the lockfile-pinned sibling package
        run: ln -sfn "$GITHUB_WORKSPACE/.aethelred-source" "$GITHUB_WORKSPACE/../aethelred"
      - run: npm ci
      - run: npm run readiness:production

  # ===========================================================================
  # BUILD
  # ===========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      [
        security-scan,
        lint-format,
        circuits-compile,
        test-frontend,
        test-backend,
        test-contracts,
        test-rust,
        test-go,
        test-docker,
      ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Checkout canonical Aethelred SDK source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: aethelred-foundation/aethelred
          ref: ${{ env.AETHELRED_REF }}
          path: .aethelred-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Build canonical Aethelred SDK
        working-directory: ./.aethelred-source/sdk/typescript
        run: |
          npm ci
          npm run build
      - name: Expose canonical SDK as the lockfile-pinned sibling package
        run: ln -sfn "$GITHUB_WORKSPACE/.aethelred-source" "$GITHUB_WORKSPACE/../aethelred"
      - run: npm ci
      - run: npm run build
